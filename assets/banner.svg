<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="35%" stop-color="#ec4899" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="cyanPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0.25)" />
      <stop offset="100%" stop-color="rgba(6, 182, 212, 0.25)" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="gatewayGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#070b14" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="meshGlow" cx="85%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#070b14" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <style>
      @keyframes dashMove {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 10px #ec4899); }
      }
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.3; }
        50% { transform: translateY(-12px) scale(1.3); opacity: 0.7; }
      }
      @keyframes glowGateway {
        0%, 100% { opacity: 0.5; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.08); }
      }

      .flowing-path {
        stroke-dasharray: 8 6;
        animation: dashMove 6s linear infinite;
      }
      .flowing-path-rev {
        stroke-dasharray: 8 6;
        animation: dashMove 8s linear infinite reverse;
      }
      .pulse-circle {
        transform-box: fill-box;
        transform-origin: center;
        animation: pulseNode 3.5s ease-in-out infinite;
      }
      .float-dot-1 {
        transform-box: fill-box;
        animation: floatParticle 5s ease-in-out infinite;
      }
      .float-dot-2 {
        transform-box: fill-box;
        animation: floatParticle 6.5s ease-in-out infinite 1.5s;
      }
      .gateway-core {
        transform-box: fill-box;
        transform-origin: center;
        animation: glowGateway 4s ease-in-out infinite;
      }
      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      .text-mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Atmospheric Glows (Behind Everything) -->
  <circle cx="200" cy="80" r="220" fill="url(#meshGlow)" />
  <circle cx="1020" cy="280" r="260" fill="url(#meshGlow)" />
  <circle cx="600" cy="180" r="280" fill="url(#gatewayGlow)" class="gateway-core" />

  <!-- Background Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="720" y1="0" x2="720" y2="360" />
    <line x1="840" y1="0" x2="840" y2="360" />
    <line x1="960" y1="0" x2="960" y2="360" />
    <line x1="1080" y1="0" x2="1080" y2="360" />
  </g>

  <!-- Dynamic Supergraph Topography / Circuit Architecture (Background Layer) -->
  <g opacity="0.45">
    <!-- Curved Connections from Services into Gateway -->
    <path d="M 90 90 C 220 90, 420 160, 580 180" fill="none" stroke="#ec4899" stroke-width="2" class="flowing-path" />
    <path d="M 90 270 C 240 270, 430 200, 580 180" fill="none" stroke="#8b5cf6" stroke-width="2" class="flowing-path-rev" />
    <path d="M 1110 90 C 970 90, 780 160, 620 180" fill="none" stroke="#06b6d4" stroke-width="2" class="flowing-path-rev" />
    <path d="M 1110 270 C 960 270, 770 200, 620 180" fill="none" stroke="#3b82f6" stroke-width="2" class="flowing-path" />

    <!-- Secondary Inter-Subgraph Mesh Lines -->
    <line x1="90" y1="90" x2="90" y2="270" stroke="#a855f7" stroke-width="1.2" stroke-dasharray="4 4" />
    <line x1="1110" y1="90" x2="1110" y2="270" stroke="#06b6d4" stroke-width="1.2" stroke-dasharray="4 4" />
    <line x1="90" y1="180" x2="580" y2="180" stroke="#ec4899" stroke-width="1" stroke-dasharray="6 6" />
    <line x1="1110" y1="180" x2="620" y2="180" stroke="#3b82f6" stroke-width="1" stroke-dasharray="6 6" />

    <!-- Subgraph Service Nodes -->
    <g transform="translate(90, 90)">
      <circle r="14" fill="#0f172a" stroke="#ec4899" stroke-width="2.5" class="pulse-circle" />
      <circle r="6" fill="#ec4899" />
      <text x="22" y="4" fill="#cbd5e1" font-size="11" class="text-mono" font-weight="600">Users Subgraph</text>
    </g>

    <g transform="translate(90, 270)">
      <circle r="14" fill="#0f172a" stroke="#8b5cf6" stroke-width="2.5" class="pulse-circle" />
      <circle r="6" fill="#8b5cf6" />
      <text x="22" y="4" fill="#cbd5e1" font-size="11" class="text-mono" font-weight="600">Orders Subgraph</text>
    </g>

    <g transform="translate(1110, 90)">
      <circle r="14" fill="#0f172a" stroke="#06b6d4" stroke-width="2.5" class="pulse-circle" />
      <circle r="6" fill="#06b6d4" />
      <text x="-22" y="4" fill="#cbd5e1" font-size="11" class="text-mono" font-weight="600" text-anchor="end">Inventory Subgraph</text>
    </g>

    <g transform="translate(1110, 270)">
      <circle r="14" fill="#0f172a" stroke="#3b82f6" stroke-width="2.5" class="pulse-circle" />
      <circle r="6" fill="#3b82f6" />
      <text x="-22" y="4" fill="#cbd5e1" font-size="11" class="text-mono" font-weight="600" text-anchor="end">Payments Subgraph</text>
    </g>
  </g>

  <!-- Floating Glow Particles -->
  <circle cx="340" cy="110" r="3.5" fill="#ec4899" class="float-dot-1" />
  <circle cx="820" cy="100" r="4" fill="#06b6d4" class="float-dot-2" />
  <circle cx="390" cy="270" r="3" fill="#8b5cf6" class="float-dot-2" />
  <circle cx="860" cy="260" r="3.5" fill="#3b82f6" class="float-dot-1" />

  <!-- Central Supergraph Core / Gateway Behind Title -->
  <g transform="translate(600, 180)" opacity="0.6">
    <!-- GraphQL Hexagon -->
    <polygon points="0,-48 42,-24 42,24 0,48 -42,24 -42,-24" fill="none" stroke="url(#cyanPurpleGrad)" stroke-width="2" stroke-dasharray="6 4" class="flowing-path" />
    <polygon points="0,-32 28,-16 28,16 0,32 -28,16 -28,-16" fill="rgba(236, 72, 153, 0.12)" stroke="#ec4899" stroke-width="1.5" />
    <circle r="8" fill="#e11d48" class="pulse-circle" />
  </g>

  <!-- ======================================================== -->
  <!-- FOREGROUND CONTENT: Guaranteed prominent and crisp       -->
  <!-- ======================================================== -->

  <!-- Top Category Chip / Pill -->
  <g transform="translate(600, 52)" filter="url(#boxShadow)">
    <rect x="-190" y="-16" width="380" height="32" rx="16" fill="#131d33" stroke="#334155" stroke-width="1.2" />
    <rect x="-188" y="-14" width="376" height="28" rx="14" fill="url(#badgeGrad)" />
    <!-- Pink dot indicator -->
    <circle cx="-168" cy="0" r="4.5" fill="#ec4899" />
    <text x="-152" y="4.5" fill="#f1f5f9" font-size="12" class="text-mono" font-weight="700" letter-spacing="0.08em">
      ENTERPRISE SUPERGRAPH DIRECTORY 2026
    </text>
  </g>

  <!-- Main Title: Big, Bold, Vibrant Gradient with Drop Shadow -->
  <text x="600" y="148" text-anchor="middle" class="text-title" font-size="44" fill="url(#primaryGrad)" filter="url(#textGlow)">
    Awesome GraphQL API Federation
  </text>

  <!-- Subtitle: High Contrast Crisp White -->
  <text x="600" y="196" text-anchor="middle" class="text-title" font-size="17" font-weight="500" fill="#f8fafc" filter="url(#textGlow)">
    Supergraph Composition • Federated Gateways • Cross-Service Schema Governance
  </text>

  <!-- Tagline / Value Proposition -->
  <text x="600" y="228" text-anchor="middle" class="text-title" font-size="13" font-weight="400" fill="#94a3b8">
    Curated Matrix of Leading SaaS Platforms &amp; Star-Ranked Open-Source Router Stacks
  </text>

  <!-- Feature Pills / Badges in Foreground -->
  <g transform="translate(600, 288)">
    <!-- Pill 1: Apollo Fed v2 Compatible -->
    <g transform="translate(-330, 0)">
      <rect x="0" y="0" width="150" height="28" rx="6" fill="#0f172a" stroke="#ec4899" stroke-width="1" opacity="0.9" />
      <text x="75" y="18" text-anchor="middle" fill="#f43f5e" font-size="11" class="text-mono" font-weight="600">⚡ Apollo Fed v2</text>
    </g>

    <!-- Pill 2: High Perf Rust & Go Routers -->
    <g transform="translate(-165, 0)">
      <rect x="0" y="0" width="155" height="28" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="1" opacity="0.9" />
      <text x="77" y="18" text-anchor="middle" fill="#c084fc" font-size="11" class="text-mono" font-weight="600">🦀 Rust &amp; Go Routers</text>
    </g>

    <!-- Pill 3: Schema Registries & Checks -->
    <g transform="translate(5, 0)">
      <rect x="0" y="0" width="155" height="28" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="1" opacity="0.9" />
      <text x="77" y="18" text-anchor="middle" fill="#22d3ee" font-size="11" class="text-mono" font-weight="600">🛡️ Schema Registry</text>
    </g>

    <!-- Pill 4: Zero Vendor Lock-in -->
    <g transform="translate(175, 0)">
      <rect x="0" y="0" width="155" height="28" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" opacity="0.9" />
      <text x="77" y="18" text-anchor="middle" fill="#34d399" font-size="11" class="text-mono" font-weight="600">🌐 100% Sovereign OSS</text>
    </g>
  </g>
</svg>
